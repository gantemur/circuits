<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12262b">
  <title>Circuits Unfolded · Linear Lab</title>
  <meta name="description" content="A transparent browser laboratory for small linear electrical circuits.">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#workspace-main" data-i18n="skipResults"></a>
  <header class="topbar">
    <div class="brand"><span class="brandmark" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M4 20h8l4-8 6 16 4-8h6"/></svg></span><span>Circuits <em>Unfolded</em></span></div>
    <div class="header-actions"><button id="about-button" type="button" class="header-link" data-i18n="workspaceHelp"></button><div class="language-switch" role="group" data-i18n-aria="languageLabel"><button type="button" data-language="en" aria-pressed="false">English</button><button type="button" data-language="mn" aria-pressed="false">Монгол</button></div></div>
  </header>
  <div class="page">
    <div id="about" class="about-box" hidden><h1 id="page-title" data-i18n="introTitle"></h1><p data-i18n="introText"></p><p data-i18n="pageDescription"></p></div>
    <div id="global-status" role="status" aria-live="polite"></div>
    <section class="circuit-bar panel" data-i18n-aria="circuitControls">
      <div class="circuit-select"><label for="circuit-select" data-i18n="circuitChoice"></label><select id="circuit-select"></select><span id="circuit-status" class="circuit-status"></span><p id="circuit-description" class="muted small"></p></div>
      <div class="circuit-actions"><button id="edit-circuit" type="button" class="button" data-i18n="editCircuit"></button><button id="new-circuit" type="button" class="button outline" data-i18n="newCircuit"></button><button id="reset-example" type="button" class="button quiet" data-i18n="resetExample"></button><label class="button outline" for="import-file" data-i18n="importJson"></label><input id="import-file" type="file" accept="application/json,.json" class="visually-hidden"><button id="export-json" type="button" class="button outline" data-i18n="exportJson"></button></div>
      <div id="import-error" class="field-error" role="alert"></div>
    </section>
    <nav id="workspace-nav" class="workspace-nav" data-i18n-aria="workspaceNavLabel"><button type="button" data-view="analyze" data-i18n="workspaceAnalyze"></button><button type="button" data-view="transform" data-i18n="workspaceTransform"></button></nav>
    <main id="workspace-main">
      <section id="analyze-view" class="workspace-view" data-i18n-aria="workspaceAnalyze">
        <div class="circuit-overview">
          <section class="panel schematic-panel" aria-labelledby="schematic-title"><div class="panel-head"><h2 id="schematic-title" data-i18n="selectedNetwork"></h2><span id="schematic-badge" class="badge"></span></div><div id="schematic" tabindex="0" role="group" aria-labelledby="schematic-title"></div><p id="schematic-note" class="muted small"></p></section>
          <section class="panel inspector-panel" aria-labelledby="component-title"><div class="panel-head"><h2 id="component-title" data-i18n="inspectComponent"></h2></div><div id="component-list"></div><div id="component-editor"></div><details id="sources-details"><summary data-i18n="sourceControls"></summary><p class="muted small" data-i18n="sourceControlsHint"></p><div id="source-editor"></div></details></section>
        </div>
        <div class="analysis-toolbar"><h2 data-i18n="workspaceAnalyze"></h2><div class="file-actions"><button id="restore-layout" type="button" class="button quiet" data-i18n="restoreLayout"></button><button id="add-analysis" type="button" class="button" data-i18n="addAnalysis"></button></div></div>
        <div id="analysis-grid" class="analysis-grid"></div><p id="analysis-limit" class="muted small" aria-live="polite"></p>
      </section>
      <section id="transform-view" class="workspace-view" data-i18n-aria="workspaceTransform" hidden><div class="panel transform-panel"><div class="panel-head"><h2 data-i18n="workspaceTransform"></h2><span class="badge">DC</span></div><label for="transform-method" data-i18n="transformMethod"></label><select id="transform-method"><option value="dc" data-i18n="transformDcMethod"></option></select><p class="soft-note" data-i18n="transformScope"></p><div id="one-port"></div></div></section>
      <section id="editor-view" class="workspace-view" data-i18n-aria="workspaceEditor" hidden><div class="editor-heading"><h2 data-i18n="workspaceEditor"></h2><button id="return-workspace" type="button" class="button outline" data-i18n="returnWorkspace"></button></div><p class="muted small" data-i18n="editorIntro"></p><div class="editor-tabs" role="group" data-i18n-aria="editorViewsLabel"><button type="button" data-editor-view="form" data-i18n="editorForm"></button><button type="button" data-editor-view="json" data-i18n="editorJson"></button></div><section id="form-editor-view" class="panel"><h3 data-i18n="builderTitle"></h3><div id="builder-editor"></div></section><section id="json-editor-view" class="panel" hidden><h3 data-i18n="editCircuitJson"></h3><p id="json-hint" class="muted small" data-i18n="jsonEditorHint"></p><div class="field"><label for="json-editor" data-i18n="jsonEditorLabel"></label><textarea id="json-editor" rows="18" spellcheck="false" aria-describedby="json-hint json-error"></textarea></div><div class="file-actions"><button id="apply-json" type="button" class="button" data-i18n="applyJson"></button><button id="restore-json" type="button" class="button outline" data-i18n="restoreJson"></button></div><div id="json-error" class="field-error" role="alert"></div></section></section>
    </main>
    <footer><span data-i18n="footerLeft"></span><span data-i18n="footerRight"></span></footer>
  </div>
</body>
</html>
