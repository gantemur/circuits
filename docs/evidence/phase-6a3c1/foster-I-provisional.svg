<svg id="w-canvas" xmlns="http://www.w3.org/2000/svg" viewBox="-90 -90 630 360" aria-label="Graphical" role="group"><style>#w-canvas { display: block; width: 100%; min-width: 580px; height: 440px; touch-action: pan-x pan-y; }
#w-canvas text { font: 12px system-ui; fill: #21314b; stroke: none; }
#w-canvas .wire-line { stroke: #486178; stroke-width: 2; fill: none; pointer-events: none; }
#w-canvas .wire-hit { stroke: transparent; stroke-width: 18; fill: none; cursor: pointer; }
#w-canvas .w-device { stroke: #21314b; stroke-width: 2; fill: white; cursor: pointer; }
#w-canvas .device-hit { fill: transparent; stroke: none; }
#w-canvas .vertex-hit { fill: transparent; stroke: none; }
#w-canvas .w-vertex { stroke: #21314b; fill: #fff; stroke-width: 2; cursor: pointer; }
#w-canvas .w-vertex.pending { stroke: #af4422; stroke-dasharray: 3 2; }
#w-canvas .selected, #w-canvas [tabindex]:focus { stroke: #076db6; stroke-width: 4; outline: none; }
#w-canvas [tabindex]:focus .wire-line { stroke: #076db6; stroke-width: 4; }
